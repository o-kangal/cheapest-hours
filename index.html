<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Germany's day-ahead electricity prices and the cheapest time window to run a flexible load."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Cheapest Hours</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1 class="title">Cheapest Hours</h1>
        <p class="subtitle">
          German day-ahead electricity prices and the cheapest time to run a flexible load.
        </p>
      </header>

      <section id="card" class="card" aria-labelledby="day-label" data-state="loading">
        <div class="card-head">
          <div>
            <h2 id="day-label" class="day-label">Day-ahead prices</h2>
            <p id="day-note" class="day-note"></p>
          </div>
          <fieldset id="controls" class="controls">
            <legend class="controls-legend">Run time</legend>
            <div class="segmented">
              <label><input type="radio" name="duration" value="1" />1 h</label>
              <label><input type="radio" name="duration" value="2" />2 h</label>
              <label><input type="radio" name="duration" value="3" checked />3 h</label>
              <label><input type="radio" name="duration" value="4" />4 h</label>
              <label><input type="radio" name="duration" value="5" />5 h</label>
              <label><input type="radio" name="duration" value="6" />6 h</label>
            </div>
          </fieldset>
        </div>
        <div class="status-row">
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <button id="retry" class="button" type="button" hidden>Retry</button>
        </div>
        <div id="chart" class="chart"></div>
        <ul class="legend">
          <li><span class="swatch swatch-cheap"></span>Cheapest window</li>
          <li><span class="swatch swatch-avg"></span>Daily average</li>
        </ul>
        <p id="summary" class="summary"></p>
      </section>

      <footer class="footer">
        <p>
          Data: <a href="https://www.energy-charts.info/">Energy-Charts</a> (Fraunhofer ISE), from
          Bundesnetzagentur | SMARD.de, licensed
          <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
          <a href="https://github.com/o-kangal/cheapest-hours">Source on GitHub</a>.
        </p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
