# Publishes dist/ to Cloudflare Pages (https://cheapest-hours.pages.dev), built with `pnpm run build`: from CI once all its checks pass on main,
# or by hand. Only main's newest commit is ever deployed, and only after CI has passed for it, so
# an older commit cannot roll the site back. Setup and secrets: docs/deploy.md.
name: Deploy

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read
      # Reading CI's results for the commit about to be deployed.
      actions: read
    steps:
      - name: Pick main's newest commit, if its CI passed
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Called from CI, after all its jobs passed for this push.
            if [ "$GITHUB_SHA" != "$sha" ]; then
              echo "main moved on to $sha; its own CI run deploys it."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&status=success" --jq .total_count)
            if [ "$passed" = 0 ]; then
              echo "::error::CI has not passed for $sha yet."
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - if: steps.target.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - if: steps.target.outputs.deploy == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # Node runs wrangler and the live check, whatever the site is built with.
      - if: steps.target.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No dependency cache: a deploy installs from the lockfile alone.
          package-manager-cache: false
      - if: steps.target.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build for production
        if: steps.target.outputs.deploy == 'true'
        run: |
          pnpm run build

      - name: Nothing but the site's files goes out
        if: steps.target.outputs.deploy == 'true'
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing."; exit 1; }
          found=$(find dist -mindepth 1 \( -name '*.map' -o -name '.*' -o -name node_modules \) -print)
          if [ -n "$found" ]; then echo "::error::Source maps or dotfiles in the output:"; echo "$found"; exit 1; fi

      - name: Deploy
        if: steps.target.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          # Pinned here rather than in a manifest, so sites without package.json deploy the same way.
          wrangler() { npx --yes wrangler@4.152.0 "$@"; }
          # The first deploy creates the Direct Upload project.
          wrangler pages project list | grep -qw cheapest-hours || wrangler pages project create cheapest-hours --production-branch=main
          wrangler pages deploy dist --project-name=cheapest-hours --branch=main --commit-hash="$SHA" --commit-dirty=false

      - name: The live pages are exactly the ones built
        if: steps.target.outputs.deploy == 'true'
        # Cloudflare features (email obfuscation, Web Analytics, …) rewrite pages and inject scripts.
        run: node scripts/check-live.mjs
